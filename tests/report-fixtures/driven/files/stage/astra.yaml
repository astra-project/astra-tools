spec_version: "0.1.0"
inputs:
  seed: {path: data/seed.txt}
decisions:
  method:
    options: {a: {}, b: {}}
outputs:
  shared:
    type: data
    format: txt
    inputs: [seed]
    recipe: {command: "cat {inputs.seed} > {output}"}
  fit:
    type: metric
    format: json
    inputs: [shared]
    decisions: [method]
    recipe: {command: "fit {inputs.shared} {decisions.method} > {output}"}
universes:
  local:
    decisions: {method: a}
