[project]

site_name = "astra-tools"
site_description = "The validator, resolver and checker of ASTRA analyses: its command line and its Python API."
site_author = "ASTRA Contributors"
copyright = "&copy; 2026 ASTRA Contributors"

repo_url = "https://github.com/astra-project/astra-tools"
repo_name = "astra-project/astra-tools"

nav = [
  { "Home" = "index.md" },
  { "CLI reference" = "cli.md" },
  { "Python API" = "api.md" },
  { "Data model" = "data-model.md" },
]

[project.theme]

variant = "modern"

features = [
  "content.code.copy",
  "content.code.select",
  "navigation.footer",
  "navigation.instant",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
]

# Light/dark palettes with a manual toggle.
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
